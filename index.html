<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Our Love Journey</title>

  <!-- Stylesheet -->
  <link rel="stylesheet" href="./style.css">

  <!-- GSAP 3.12.5 & MotionPathPlugin CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
</head>
<body>
  <!-- Container cho toàn bộ cảnh / viewport -->
  <main class="scene-container">
    <!-- Nút bật chế độ chỉnh sửa (nhỏ gọn, không cản trở game) -->
    <button id="edit-mode-btn" type="button" aria-label="Bật chế độ chỉnh sửa" title="Bật chế độ chỉnh sửa">
      <svg class="edit-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span id="edit-badge" class="edit-badge hidden">Đang chỉnh sửa</span>
    </button>

    <!-- Khu vực bản đồ / SVG Path & Nhân vật -->
    <div id="map-container">
      <svg id="journey-svg" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg">
        <!-- Đường dẫn (Path) mẫu kết nối 7 điểm mốc -->
        <path id="journey-path" d="" fill="none" stroke="transparent" />
        
        <!-- Nhân vật di chuyển dọc path -->
        <g id="character">
          <!-- Placeholder hình nhân vật -->
        </g>
      </svg>
    </div>

    <!-- Khu vực hiển thị câu hỏi trắc nghiệm & tương tác -->
    <section id="quiz-container" aria-live="polite">
      <div id="scene-info">
        <span id="scene-indicator"></span>
        <h2 id="scene-title"></h2>
      </div>

      <!-- Khối nhật ký kỷ niệm trước khi hiện câu hỏi -->
      <div id="journal-container">
        <p id="journal-text"></p>
        <button id="continue-btn">Tiếp tục</button>
      </div>

      <div id="question-box">
        <p id="question-text"></p>
        <div id="options-list"></div>
      </div>

      <div id="hint-box">
        <p id="hint-text"></p>
      </div>

      <div id="feedback-message"></div>

      <!-- Khu vực hiển thị media sau khi mở khóa scene -->
      <div id="media-container"></div>
    </section>

    <!-- Khu vực hiển thị kết bài (Epilogue - Scene 7) -->
    <section id="epilogue-container" class="hidden">
      <div id="epilogue-content">
        <h2 id="epilogue-title"></h2>
        <p id="epilogue-message"></p>
      </div>
    </section>
  </main>

  <!-- Modal Nhập PIN Chế độ chỉnh sửa -->
  <div id="pin-modal" class="pin-modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pin-modal-title">
    <div class="pin-modal-card">
      <h3 id="pin-modal-title">Chế độ chỉnh sửa</h3>
      <p class="pin-modal-desc">Nhập mã PIN để bật quyền chỉnh sửa kỷ niệm</p>
      
      <div class="pin-input-group">
        <input type="password" id="pin-input" maxlength="20" placeholder="Nhập mã PIN..." autocomplete="off" inputmode="numeric" />
        <p id="pin-error-msg" class="pin-error-msg hidden"></p>
      </div>

      <div class="pin-modal-actions">
        <button type="button" id="pin-cancel-btn" class="pin-btn pin-btn-cancel">Huỷ</button>
        <button type="button" id="pin-confirm-btn" class="pin-btn pin-btn-confirm">Xác nhận</button>
      </div>
    </div>
  </div>

  <!--
    THỨ TỰ SCRIPT (bắt buộc):
    1. firebase-config.js  — classic, expose window.FIREBASE_CONFIG
    2. content.js / data.js — classic, define SCENES_DATA (fallback offline)
    3. firebase-bridge.js  — type="module" (deferred, chạy trước DOMContentLoaded)
                             import Firebase CDN, onSnapshot → dispatch events
    4. main.js             — classic, lắng nghe lj:scenesReady / lj:scenesUpdated
  -->
  <script src="./firebase-config.js"></script>

  <!-- Backup tĩnh — vẫn load để main.js dùng làm fallback khi offline/Firestore lỗi -->
  <script src="./content.js"></script>
  <script src="./data.js"></script>

  <!-- Firebase bridge (ES Module) -->
  <script type="module" src="./firebase-bridge.js"></script>

  <!-- Logic game -->
  <script src="./main.js"></script>
</body>
</html>
